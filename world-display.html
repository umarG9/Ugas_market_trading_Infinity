<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UGAS WORLD DOMINATION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#93c5fd;font-family:Rajdhani,sans-serif;padding:12px}
#ugasWorldWrap{
  position:relative; width:100%; height:100vh; min-height:620px;
  background: radial-gradient(circle at 25% 10%, rgba(59,130,246,.35), transparent 45%), 
              radial-gradient(circle at 85% 90%, rgba(37,99,235,.25), transparent 40%), #000;
  border: 2px solid #3b82f6; border-radius:20px; overflow:hidden;
  box-shadow: 0 0 50px rgba(59,130,246,.6), inset 0 0 80px rgba(59,130,246,.1);
}
#ugasMapCanvas{width:100%; height:100%; display:block}
#worldStats{
  position:absolute; top:12px; left:12px; right:12px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
}
.world-stat{
  background: rgba(0,0,0,.9); border:1px solid #60a5fa; border-radius:12px;
  padding:10px; text-align:center; backdrop-filter:blur(6px);
  box-shadow: 0 0 20px rgba(59,130,246,.4);
}
.world-stat b{display:block; color:#fff; font-size:18px; text-shadow:0 0 12px #60a5fa}
#futureDisplay{
  position:absolute; bottom:12px; left:12px; right:12px;
  background: rgba(5,18,40,.96); border:1px solid #60a5fa; border-radius:16px;
  padding:14px; display:grid; grid-template-columns:1fr 1fr; gap:14px;
  box-shadow: 0 0 30px rgba(59,130,246,.5);
}
.future-bar{height:8px; background:#000; border-radius:4px; overflow:hidden; margin-top:5px; border:1px solid #1d4ed8}
.future-bar i{display:block; height:100%; background:linear-gradient(90deg,#1d4ed8,#60a5fa); width:0%; transition:width 1s; box-shadow:0 0 10px #60a5fa}
.change-box{grid-column:1 / -1; text-align:center; padding:10px; background:#000; border-radius:10px; border:1px solid #3b82f6; color:#60a5fa; font-weight:700; letter-spacing:1px; text-shadow:0 0 10px #3b82f6}
@media(max-width:700px){#worldStats{grid-template-columns:1fr 1fr} #futureDisplay{grid-template-columns:1fr}}
</style>
</head><body>
<div id="ugasWorldWrap">
  <canvas id="ugasMapCanvas"></canvas>
  
  <div id="worldStats">
    <div class="world-stat">🌍 DOMINATION<b id="dominationPct">0%</b><div class="future-bar"><i id="dominationBar"></i></div></div>
    <div class="world-stat">🏙️ CITIES<b id="citiesCount">0/12</b><div class="future-bar"><i id="citiesBar"></i></div></div>
    <div class="world-stat">👥 USERS<b id="totalUsers">0</b><div style="font-size:10px">Worldwide</div></div>
    <div class="world-stat">💳 E-MONEY<b>2030</b><div style="font-size:10px">Full Digital</div></div>
  </div>
  
  <div id="futureDisplay">
    <div>
      <div style="display:flex;justify-content:space-between">Electronic Money Adoption <span id="pct0">0%</span></div>
      <div class="future-bar"><i id="future-0"></i></div>
      <div style="display:flex;justify-content:space-between; margin-top:10px">UGAS in All Shops <span id="pct1">0%</span></div>
      <div class="future-bar"><i id="future-1"></i></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between">Cashless World <span id="pct2">0%</span></div>
      <div class="future-bar"><i id="future-2"></i></div>
      <div style="display:flex;justify-content:space-between; margin-top:10px">Bank Integration <span id="pct3">0%</span></div>
      <div class="future-bar"><i id="future-3"></i></div>
    </div>
    <div class="change-box" id="changeText">2026: Cash → UGAS Digital Begins</div>
  </div>
</div>

<script>
const CITIES = [
  {name:"ABUJA", x:52, y:48}, {name:"LAGOS", x:51, y:52}, {name:"DUBAI", x:62, y:45},
  {name:"LONDON", x:49, y:30}, {name:"NEW YORK", x:22, y:35}, {name:"TOKYO", x:85, y:38},
  {name:"SINGAPORE", x:75, y:62}, {name:"BERLIN", x:53, y:31}, {name:"SÃO PAULO", x:32, y:70},
  {name:"SYDNEY", x:88, y:78}, {name:"JOHANNESBURG", x:56, y:72}, {name:"ISTANBUL", x:57, y:36}
];
let canvas = document.getElementById('ugasMapCanvas'), ctx = canvas.getContext('2d');
let domination=0, grow=0;

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  canvas.width=r.width*2; canvas.height=r.height*2;
  ctx.setTransform(2,0,0,2,0,0);
}
function draw(){
  const w=canvas.width/2, h=canvas.height/2;
  ctx.clearRect(0,0,w,h);
  // grid - illustration only, not accurate map
  ctx.strokeStyle='rgba(59,130,246,.08)'; ctx.lineWidth=0.5;
  for(let i=0;i<24;i++){ctx.beginPath();ctx.moveTo(0,i*h/24);ctx.lineTo(w,i*h/24);ctx.stroke(); ctx.beginPath();ctx.moveTo(i*w/24,0);ctx.lineTo(i*w/24,h);ctx.stroke();}
  // continents blobs
  ctx.fillStyle='rgba(30,58,138,.18)'; ctx.strokeStyle='rgba(59,130,246,.35)';
  const blobs=[[0.53,0.55,0.06,0.18],[0.52,0.32,0.08,0.08],[0.70,0.38,0.18,0.15],[0.20,0.35,0.15,0.18],[0.28,0.68,0.06,0.16],[0.85,0.75,0.07,0.06]];
  blobs.forEach(b=>{ctx.beginPath();ctx.ellipse(w*b[0],h*b[1],w*b[2],h*b[3],0,0,Math.PI*2);ctx.fill();ctx.stroke();});
  // lines + nodes
  CITIES.forEach(c=>{
    const px=w*c.x/100, py=h*c.y/100;
    if(c.name!=="ABUJA"){
      ctx.strokeStyle=`rgba(96,165,250,${0.15+domination/250})`; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(w*0.52,h*0.48); ctx.lineTo(px,py); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.shadowColor='#60a5fa'; ctx.shadowBlur=18; ctx.fillStyle='#60a5fa';
    ctx.beginPath(); ctx.arc(px,py,4+domination/30,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='bold 11px Rajdhani'; ctx.fillText(c.name, px+9, py-6);
  });
}
function loop(){
  if(domination<100) domination+=0.18;
  if(grow<92) grow+=0.22;
  document.getElementById('dominationPct').textContent=domination.toFixed(1)+'%';
  document.getElementById('dominationBar').style.width=domination+'%';
  document.getElementById('citiesBar').style.width=domination+'%';
  document.getElementById('citiesCount').textContent=Math.floor(domination/8.4)+'/12';
  document.getElementById('totalUsers').textContent=(domination*125000).toLocaleString();
  const targets=[92,78,85,88];
  targets.forEach((t,i)=>{
    const cur=Math.min(t, grow + Math.random()*8);
    document.getElementById('future-'+i).style.width=cur+'%';
    document.getElementById('pct'+i).textContent=cur.toFixed(0)+'%';
  });
  draw(); requestAnimationFrame(loop);
}
const texts=["2026: Cash → UGAS Digital Begins","2027: Shops Worldwide Accept UGAS","2028: Banks Integrate UGAS Network","2029: 1 Billion Users on UGAS","2030: World Fully Electronic Money - No Cash","2031: UGAS Powers Everything"];
let ti=0; setInterval(()=>{document.getElementById('changeText').textContent=texts[ti%texts.length]; ti++;}, 2800);
window.addEventListener('resize', resize);
resize(); loop();
</script>
</body></html>
